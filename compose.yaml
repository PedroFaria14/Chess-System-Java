services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - chess-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/chess
      DATABASE_USER: chess
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      SERVER_ADDRESS: 0.0.0.0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chess-data:
